[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-sender"
version = "0.1.0"
description = "Grounded outgoing recipient extraction and registry resolution"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "python-multipart>=0.0.12", "httpx>=0.27", "pypdf>=5", "pdfplumber>=0.11", "python-dotenv>=1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4"]
ocr = [
    # Upstream fixes the old PyPI release's incompatible Pillow/training pins.
    "vietocr @ https://github.com/pbcquoc/vietocr/archive/fe8c3a7fc714aec57ab81cec844eb3adf0c1636c.zip",
    "onnxruntime>=1.23,<2",
    "opencv-python-headless>=4.10,<6",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
